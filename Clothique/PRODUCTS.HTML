<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Clothique</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; color: #333; }
        
        /* Navigation */
        nav { background: #1a1a2e; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #e94560; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: #fff; text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: #e94560; }
        .cart-icon { position: relative; color: white; font-size: 1.5rem; cursor: pointer; text-decoration: none; }
        .cart-count { position: absolute; top: -10px; right: -10px; background: #e94560; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }
        
        /* Page Header */
        .page-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 3rem 5%; text-align: center; }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        
        /* Filters */
        .filters { padding: 2rem 5%; background: white; border-bottom: 1px solid #e0e0e0; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 0.6rem 1.5rem; border: 2px solid #e0e0e0; background: white; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: #e94560; color: white; border-color: #e94560; }
        .search-box { padding: 0.6rem 1rem; border: 2px solid #e0e0e0; border-radius: 25px; width: 250px; font-size: 1rem; }
        .search-box:focus { outline: none; border-color: #e94560; }
        
        /* Products Grid */
        .products-container { padding: 3rem 5%; max-width: 1400px; margin: 0 auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        
        .product-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: all 0.3s; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .product-image { height: 280px; display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative; }
        .product-badge { position: absolute; top: 15px; left: 15px; background: #e94560; color: white; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .product-details { padding: 1.5rem; }
        .product-category { color: #e94560; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .product-name { font-size: 1.2rem; color: #1a1a2e; margin: 0.5rem 0; }
        .product-description { color: #666; font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.5; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-size: 1.4rem; font-weight: bold; color: #e94560; }
        .add-btn { padding: 0.7rem 1.5rem; background: #1a1a2e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .add-btn:hover { background: #e94560; transform: scale(1.05); }
        
        /* Toast Notification */
        .toast { position: fixed; bottom: 30px; right: 30px; background: #2ed573; color: white; padding: 1rem 2rem; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: none; z-index: 1000; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        @media (max-width: 768px) { .nav-links { display: none; } .products-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">CLOTHIQUE</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <a href="dashboard.html" class="cart-icon">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </a>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <h1>Our Collection</h1>
        <p>Premium jeans, t-shirts, and jackets for every style</p>
    </section>

    <!-- Filters -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('all')">All</button>
        <button class="filter-btn" onclick="filterProducts('jeans')">Jeans</button>
        <button class="filter-btn" onclick="filterProducts('tshirts')">T-Shirts</button>
        <button class="filter-btn" onclick="filterProducts('jackets')">Jackets</button>
        <input type="text" class="search-box" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
    </div>

    <!-- Products -->
    <section class="products-container">
        <div class="products-grid" id="productsGrid"></div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast">Added to cart!</div>

    <script>
        // Product database
        const products = [
            { id: 1, name: "Classic Blue Jeans", category: "jeans", price: 49.99, icon: "👖", badge: "Bestseller", description: "Timeless straight-fit denim with premium cotton blend." },
            { id: 2, name: "Slim Fit Black Jeans", category: "jeans", price: 54.99, icon: "👖", badge: "New", description: "Modern slim cut with stretch comfort technology." },
            { id: 3, name: "Ripped Skinny Jeans", category: "jeans", price: 59.99, icon: "👖", badge: "Hot", description: "Trendy distressed design with tapered ankle fit." },
            { id: 4, name: "Premium Cotton Tee", category: "tshirts", price: 29.99, icon: "👕", badge: "Popular", description: "100% organic cotton with reinforced stitching." },
            { id: 5, name: "Graphic Print T-Shirt", category: "tshirts", price: 34.99, icon: "👕", badge: "New", description: "Unique artistic prints on breathable fabric." },
            { id: 6, name: "Vintage Denim Jacket", category: "jackets", price: 79.99, icon: "🧥", badge: "Classic", description: "Authentic vintage wash with brass button details." },
            { id: 7, name: "Bomber Jacket", category: "jackets", price: 89.99, icon: "🧥", badge: "Trending", description: "Lightweight bomber with quilted lining." },
            { id: 8, name: "Leather Biker Jacket", category: "jackets", price: 129.99, icon: "🧥", badge: "Premium", description: "Genuine leather with zippered pockets and vents." }
        ];

        let currentFilter = 'all';

        // Render products
        function renderProducts(filter = 'all', searchTerm = '') {
            const grid = document.getElementById('productsGrid');
            let filtered = products;
            
            if (filter !== 'all') {
                filtered = filtered.filter(p => p.category === filter);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #666;">No products found.</div>';
                return;
            }
            
            grid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-image" style="background: ${getCategoryColor(product.category)};">
                        <span class="product-badge">${product.badge}</span>
                        ${product.icon}
                    </div>
                    <div class="product-details">
                        <div class="product-category">${product.category}</div>
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div class="product-footer">
                            <span class="product-price">$${product.price}</span>
                            <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getCategoryColor(category) {
            const colors = { jeans: '#e3f2fd', tshirts: '#fce4ec', jackets: '#f3e5f5' };
            return colors[category] || '#f5f5f5';
        }

        function filterProducts(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(category, document.getElementById('searchInput').value);
        }

        function searchProducts() {
            const term = document.getElementById('searchInput').value;
            renderProducts(currentFilter, term);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            let cart = JSON.parse(localStorage.getItem('clothique_cart')) || [];
            cart.push(product);
            localStorage.setItem('clothique_cart', JSON.stringify(cart));
            
            // Update cart count
            document.getElementById('cartCount').textContent = cart.length;
            
            // Show toast
            const toast = document.getElementById('toast');
            toast.textContent = `${product.name} added to cart!`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // Initialize
        window.onload = function() {
            renderProducts();
            const cart = JSON.parse(localStorage.getItem('clothique_cart')) || [];
            document.getElementById('cartCount').textContent = cart.length;
        };
    </script>
</body>
</html>
