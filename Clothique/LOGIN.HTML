<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Clothique</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        
        .login-container { background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .logo-text { text-align: center; font-size: 2rem; font-weight: bold; color: #e94560; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #1a1a2e; font-weight: 600; }
        input { width: 100%; padding: 0.9rem; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #e94560; }
        
        .btn-login { width: 100%; padding: 1rem; background: #e94560; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-top: 1rem; }
        .btn-login:hover { background: #c73e54; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4); }
        
        .signup-link { text-align: center; margin-top: 1.5rem; color: #666; }
        .signup-link a { color: #e94560; text-decoration: none; font-weight: 600; }
        
        .error-alert { background: #ff4757; color: white; padding: 1rem; border-radius: 10px; text-align: center; margin-bottom: 1rem; display: none; }
        
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; }
        .remember-forgot label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; }
        .remember-forgot a { color: #e94560; text-decoration: none; }
        
        @media (max-width: 480px) { .login-container { padding: 2rem 1.5rem; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-text">CLOTHIQUE</div>
        <p class="subtitle">Welcome back! Please login</p>
        
        <div class="error-alert" id="errorAlert">Invalid email or password!</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="remember-forgot">
                <label><input type="checkbox" id="remember"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-login">Login</button>
        </form>
        
        <p class="signup-link">Don't have an account? <a href="signup.html">Sign up here</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            
            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('clothique_users')) || [];
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Set current user
                localStorage.setItem('clothique_current_user', JSON.stringify(user));
                localStorage.setItem('clothique_welcome', user.fullname);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                errorAlert.style.display = 'block';
                setTimeout(() => { errorAlert.style.display = 'none'; }, 3000);
            }
        });
    </script>
</body>
</html>
